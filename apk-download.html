<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#071b12;color:#fff;font:16px system-ui,sans-serif;padding:20px;box-sizing:border-box}.card{max-width:480px;width:100%;box-sizing:border-box;border:1px solid #d6aa39;border-radius:20px;padding:28px;text-align:center;background:#0c281b}img{width:100%;max-width:260px;height:auto}.btn{display:inline-block;background:#d6aa39;color:#071b12;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:800;margin:8px 4px}.muted{color:#c9d6ce;line-height:1.6;font-size:14px}.status{margin:18px 0;padding:14px;border-radius:12px;background:#143a28}.back{color:#ffe88a}</style>
</head><body><main class="card"><img src="/jiowin-logo.svg" alt="Jiowin"><h1>Jiowin Android App</h1><p>Install Jiowin on your phone.</p><div id="apkStatus" class="status">Checking APK availability…</div><a id="apkButton" class="btn" href="/downloads/jiowin.apk" hidden download>Download APK</a><p class="muted">Agar APK download enabled nahi hai, website ko PWA ke roop mein install kar sakte hain. Android APK release ko publish karne se pehle Android build aur installation test zaroori hai.</p><a class="back" href="/">← Back to Jiowin</a></main><script src="/pwa-install.js"></script><script>(async()=>{const s=document.getElementById('apkStatus'),b=document.getElementById('apkButton');try{const r=await fetch('/downloads/jiowin.apk',{method:'HEAD',cache:'no-store'});if(r.ok){s.textContent='APK ready. Only install if you trust this source.';b.hidden=false;}else{s.textContent='APK file abhi website par publish nahi hui hai. PWA Install App option abhi use kar sakte hain.';}}catch(e){s.textContent='APK availability check nahi ho saka. PWA Install App option use karein.';}})();</script></body></html>
